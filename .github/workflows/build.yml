名称: 构建APK

开启:
推送:
分支: [主分支]
工作流调度:

作业:
构建:
运行环境: ubuntu-latest

步骤:
      - 名称: 检出代码
使用: actions/checkout@v4

      - 名称: 设置 JDK 17
: actions/setup-java@v4
与:
发行版: 'temurin'
Java 版本: '17'

      # 手动接受 SDK 许可，并安装 Android 4.4 项目需要的 SDK 28
      - 名称: 接受许可并安装 SDK 28
运行: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses || true
是 | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager "platforms;android-28" "build-tools;28.0.3" || true

      - 名称: 为 gradlew 授予执行权限
: chmod +x gradlew

      - 名称: 构建 Debug APK
运行: ./gradlew assembleDebug --no-daemon

      - 名称: 上传APK
使用: actions/upload-artifact@v4
与:
名称: app-debug
路径: app/build/outputs/apk/debug/app-debug.apk
保留天数: 3000
